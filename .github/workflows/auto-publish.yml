name: Obsidian ProtoSem Auto-Publish

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'portfolio-content/**'
      - 'scripts/build-templates.js'
      - 'package.json'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile Obsidian content
        run: npm run build:protosem

      - name: Commit generated portfolio content
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: compile Obsidian ProtoSem journal 🚀'
          file_pattern: 'content/protosem/** assets/weekly/**'
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
