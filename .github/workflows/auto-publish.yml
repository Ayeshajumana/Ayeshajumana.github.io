name: Obsidian Weekly Auto-Publish

on:
  schedule:
    - cron: '0 5 * * 1' # Runs every Monday at 5:00 AM UTC
  workflow_dispatch: 
  push:
    paths:
      - 'portfolio-content/**'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Weekly Templates
        run: node scripts/build-templates.js

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-compile weekly obsidian templates 🚀"
          file_pattern: "public/assets/weekly/** src/content/blogs/**"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          skip_dirty_check: false 
